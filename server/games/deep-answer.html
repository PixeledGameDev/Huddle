const cv=document.createElement("canvas");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";document.body.appendChild(cv);
const cx=cv.getContext("2d");let PS=[],raf=0;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener("resize",fit);
function loop(){cx.clearRect(0,0,cv.width,cv.height);PS=PS.filter(p=>p.l>0);
 for(const p of PS){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.95;p.vy*=.95;p.l--;const z=Math.max(2,Math.round(p.s*p.l/p.L/2)*2),x=Math.round(p.x),y=Math.round(p.y);cx.fillStyle="#0b1230";cx.fillRect(x-1,y-1,z+2,z+2);cx.fillStyle=p.c;cx.fillRect(x,y,z,z)}

function burst(x,y,n,col,spd=3.2,life=34,sz=6,g=0){if(!fxOn)return;n=Math.round(n*CFG.pm);spd*=CFG.ps;
 for(let k=0;k<n;k++){const a=k/n*6.283+Math.random()*.4,v=spd*(.6+Math.random()*.7);PS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life,L:life,c:Array.isArray(col)?col[k%col.length]:col,s:sz,g})}

const lastv={};

[["#ff9f43",18,26,0,0],["#5ee6a8",52,38,-14,1],["#ff5d73",78,32,-6,0]].map(([c,y,d,dl,f])=>`<div class="fish" style="top:${y}%;animation-duration:${d}s;animation-delay:${dl}s;${f?"animation-name:swimL":""}">${fishSvg(c,f?0:1)}</div>`).join("");

function start(){
 pts=0;Q=[];setDepth();

 $.innerHTML=`<h1 class="w">${wv("DEEP")}<br>${wv("ANSWER")}</h1><h2>Rare answers sink you deeper.</h2>

 ${sl("sn","Questions",3,P.length,1,S.n)}${sl("sd","Difficulty",1,3,1,S.d)}<p class="hint" id="sdd"></p>${sl("st","Time per question",10,60,5,S.t)}
 <div class="row"><button id="go">Start dive</button><button class="alt" id="fxb">Effects: ${fxOn?"On":"Off"}</button></div>`;
 const g=id=>document.getElementById(id);
 const upd=()=>{g("snv").textContent=g("sn").value;g("stv").textContent=g("st").value+"s";const d=DIFF[+g("sd").value];g("sdv").textContent=d.n;g("sdd").textContent=d.d+" A perfect dive reaches "+(g("sn").value*1000)+" m."};
