[package]
name = "huddle-desktop"
version = "3.0.2"
description = "Huddle desktop app"
authors = ["Huddle"]
license = "UNLICENSED"
edition = "2024"

[dependencies]
arboard = "3.7.0"
auto-launch = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
futures-util = "0.3.34"
global-hotkey = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
interprocess = "2.4.7"
muda = "0.21.2"
open = "5.4.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "cookies"] }
rfd = "0.17.2"
rust_socketio = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sysinfo = "0.38.4"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tray-icon = "0.26.1"
url = "2.5.8"
user-idle = "0.6.0"
wry = { version = "0.57.1", features = ["devtools"] }

[target.'cfg(target_os="linux")'.dependencies]
gtk = "0.18"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Windows installer, built by cargo-packager (see README.md)
[package.metadata.packager]
product-name = "Huddle"
identifier = "app.huddle.desktop"
icons = ["assets/icon.ico"]
formats = ["nsis"]
out-dir = "dist"

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
header-image = "installer/installerHeader.bmp"
sidebar-image = "installer/installerSidebar.bmp"
installer-mode = "currentUser"
