<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'" />
  <title>Huddle</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { padding: 10px; box-sizing: border-box; font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #e6e9f2; }
    main {
      height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; padding: 12px 14px 12px;
      border-radius: 20px; border: 1px solid #2d3550; background: #1a1f2e; box-shadow: 0 10px 34px rgba(0, 0, 0, .55);
      animation: slide .25s cubic-bezier(.2, .8, .2, 1) both; cursor: default;
    }
    header { display: flex; align-items: center; gap: 8px; min-width: 0; }
    header img { width: 18px; height: 18px; flex: none; }
    header b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .x { border: 0; background: none; color: #9aa3bd; cursor: pointer; font-size: 14px; width: 24px; height: 24px; border-radius: 8px; }
    .x:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .body { margin: 0; color: #c3cae0; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; cursor: pointer; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
    input { min-width: 0; font: inherit; color: inherit; padding: 7px 12px; border-radius: 999px; border: 1px solid #2d3550; background: #11151f; outline: none; }
    input:focus { border-color: #5d7af0; }
    button.send { font: inherit; font-weight: 600; color: #fff; padding: 7px 14px; border-radius: 999px; border: 1px solid #5d7af0; background: #5d7af0; cursor: pointer; }
    button.send:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; align-items: center; }
    .link { font: inherit; font-size: 12px; font-weight: 600; color: #8ea2f5; background: none; border: 0; cursor: pointer; padding: 2px 4px; }
    .link:hover { text-decoration: underline; }
    .status { flex: 1; font-size: 12px; color: #9aa3bd; text-align: right; }
    .status.err { color: #f07a76; } .status.ok { color: #5cc98a; }
    @keyframes slide { from { opacity: 0; transform: translateX(24px); } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main id="card">
    <header><img src="../build/icon.png" alt="" /><b id="title"></b><button class="x" id="close" aria-label="Dismiss">✕</button></header>
    <p class="body" id="body" title="Open in Huddle"></p>
    <div>
      <form id="form" autocomplete="off"><input id="reply" placeholder="Reply…" maxlength="2000" aria-label="Reply" /><button class="send" id="send" disabled>Send</button></form>
      <div class="row"><button class="link" id="read" type="button">Mark as read</button><button class="link" id="open" type="button">Open</button><span class="status" id="status" role="status"></span></div>
    </div>
  </main>
  <script src="toast.js"></script>
</body>
</html>
