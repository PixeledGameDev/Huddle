# Render Blueprint: one web service (API + WebSockets + built frontend) and one Postgres.
services:
  - type: web
    name: huddle
    runtime: node
    plan: starter            # free instances spin down when idle, which drops WebSocket connections
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: huddle-db
          property: connectionString

databases:
  - name: huddle-db
    plan: basic-256mb
